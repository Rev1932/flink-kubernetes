# MongoDB do ambiente LOCAL apenas.
#
# Em producao o MongoDB e externo e gerenciado fora desta plataforma: os tenants
# recebem a connection URI por Secret (ver `mongo.existingSecret` no chart).
# Este manifesto existe unicamente para que `make test-e2e` consiga validar a
# escrita no sink de ponta a ponta.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-dev-credentials
  namespace: storage
type: Opaque
stringData:
  username: root
  password: rootpass
  # URI consumida pelos jobs Flink. O chart copia este valor para um Secret no
  # namespace de cada tenant (Secrets nao atravessam namespaces).
  uri: mongodb://root:rootpass@mongodb.storage.svc.cluster.local:27017/?authSource=admin
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: storage
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: storage
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: mongodb-dev-credentials, key: username }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongodb-dev-credentials, key: password }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
