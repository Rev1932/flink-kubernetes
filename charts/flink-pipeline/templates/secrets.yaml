{{- $slug := include "tenant.slug" . }}
{{- if not .Values.mongo.existingSecret }}
{{- if not .Values.mongo.uri }}
{{- fail "defina mongo.existingSecret (recomendado) ou mongo.uri (apenas desenvolvimento)" }}
{{- end }}
# Secret gerado a partir de values -- SOMENTE para o ambiente local.
#
# Em producao aponte mongo.existingSecret para um Secret gerenciado fora deste
# repositorio (External Secrets, Sealed Secrets, Vault). Colocar a URI em
# values.yaml a versiona em texto puro no Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $slug }}-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mongo.existingSecretKey }}: {{ .Values.mongo.uri | quote }}
{{- end }}
---
{{- if and (not .Values.storage.s3.existingSecret) .Values.storage.s3.accessKeyName }}
# Idem: credenciais do MinIO local. Em S3 real prefira IRSA/Workload Identity e
# deixe storage.s3.accessKeyName vazio -- nenhum Secret e criado e o provider
# chain da AWS usa a identidade do pod.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $slug }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.storage.s3.accessKeyName | quote }}
  secret-key: {{ .Values.storage.s3.secretKeyName | quote }}
{{- end }}
